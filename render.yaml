services:
  - type: web
    name: ipe-payment-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: PAYMENTS_CHANNEL_ID
        sync: false
      - key: FREE_LESSON_CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: RUN_MODE
        value: polling
      - key: MAX_CHILDREN
        value: "10"
      - key: PYTHON_VERSION
        value: 3.11.9
